[project]
name = "compliant-wheel"
version = "2.1.0"
description = "Co-optimized compliant PLA UAV wheel: GA over an analytical beam model, STEP export, and (in progress) a nonlinear FEA refinement pipeline."
requires-python = ">=3.12"

# Dependencies live in requirements-opt.txt / requirements-cad.txt rather than here.
# The project is two scripts run by two different interpreters, not an installable
# package, and expressing that as a single dependency set would imply CadQuery and pygad
# can share an env — they cannot.

[tool.pytest.ini_options]
testpaths = ["tests"]
# The modules live in src/ and the study drivers in studies/; both are imported
# flat.  conftest.py mirrors this into PYTHONPATH for the tests that spawn a
# subprocess, so `pytest` and `make test` resolve identically.
pythonpath = ["src", "studies", "."]
addopts = "-q"

# STRICT BY DEFAULT, AND THIS CHANGES THE MEANING OF EVERY FUTURE BARE `xfail` HERE.
#
# Introduced by the REDS arc (PLAN.md §31).  Before it, `make test` read `5 failed` on a
# good day, and establishing "no new red" meant opening CONTACT_PLAN.md to look up which
# five were expected — a suite that reads `5 failed` when healthy cannot cheaply tell you
# about a sixth.  Two of the five were findings the project has accepted and does not
# intend to act on yet; they are now `xfail` rather than `fail`, so the count is 0.
#
# `xfail_strict` is what makes that safe rather than a way of hiding things.  Without it,
# an xfail that STARTS PASSING is reported as `xpass` and nobody notices — the accepted
# finding would silently become stale, which is the precise failure mode PLAN §28 caught
# after it had travelled through three plan files.  With it, an xpass is a FAILURE, so the
# day the wheel changes enough for one of these to pass, the suite reopens the question by
# itself.
#
# Set here rather than `strict=True` at each `@pytest.mark.xfail`, so the next person to
# add one cannot forget it.  Every xfail in this tree must carry a `reason=` naming the
# PLAN section that decided it.
xfail_strict = true

[tool.pyright]
# Point the type checker at env-opt; without this it resolves against system python3,
# which has no numpy, and reports every import as missing.
venvPath = "."
venv = ".venv-opt"
# wheel_step_export.py imports cadquery/OCP, which only exist in env-cad.
ignore = ["src/wheel_step_export.py"]
